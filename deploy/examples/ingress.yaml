apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ums
  namespace: ums
spec:
  # Set ingressClassName to your cluster's installed ingress controller.
  tls:
    - hosts: [ums.example.com]
      secretName: ums-tls
  rules:
    - host: ums.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ums-web
                port: {number: 3000}
