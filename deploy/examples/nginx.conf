# Add this server to your existing TLS-enabled Nginx configuration.
server {
    listen 443 ssl;
    server_name ums.example.com;
    ssl_certificate /etc/letsencrypt/live/ums.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ums.example.com/privkey.pem;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
server {
    listen 80;
    server_name ums.example.com;
    return 301 https://$host$request_uri;
}
