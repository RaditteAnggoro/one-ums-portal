apiVersion: apps/v1
kind: Deployment
metadata:
  name: ums-web
  namespace: ums
spec:
  replicas: 1
  selector:
    matchLabels: {app: ums-web}
  template:
    metadata:
      labels: {app: ums-web}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: web
          image: one-ums-portal:0.1.0
          imagePullPolicy: IfNotPresent
          command: [node, node_modules/next/dist/bin/next, start, apps/web, --hostname, 0.0.0.0, --port, "3000"]
          envFrom:
            - configMapRef: {name: ums-config}
          ports: [{name: http, containerPort: 3000}]
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /dashboard, port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ums-web
  namespace: ums
spec:
  selector: {app: ums-web}
  ports: [{name: http, port: 3000, targetPort: http}]
