apiVersion: batch/v1
kind: Job
metadata:
  name: ums-migrate-001
  namespace: ums
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: migrate
          image: one-ums-portal:0.1.0
          imagePullPolicy: IfNotPresent
          command: [node, dist/scripts/migrate-db.js]
          envFrom:
            - configMapRef: {name: ums-config}
            - secretRef: {name: ums-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
